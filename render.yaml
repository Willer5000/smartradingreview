# COMMIT 34 — native app:app core, validated-route expansion + 512MB governor.
services:
  - type: web
    name: crypto-trader-analyst
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --timeout 180 --workers 1 --threads 2 --worker-class gthread --graceful-timeout 30 --max-requests 0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_ARENA_MAX
        value: "1"
      - key: PYTHONMALLOC
        value: "malloc"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: BLIS_NUM_THREADS
        value: "1"

      # One heavy job; permanent daemon count is not a concurrency gate.
      - key: FREE_RUNTIME_MAX_THREADS
        value: "10"
      - key: FREE_RUNTIME_BACKGROUND_LOCK_WAIT_SECONDS
        value: "0"
      - key: FREE_RUNTIME_INTERACTIVE_LOCK_WAIT_SECONDS
        value: "12"

      # Native app.py memory authority.  Commit21.1 no longer overwrites these.
      - key: LOW_MEMORY_MODE
        value: "1"
      - key: MEMORY_SOFT_LIMIT_MB
        value: "310"
      - key: MEMORY_HARD_LIMIT_MB
        value: "365"
      - key: MEMORY_JOB_START_LIMIT_MB
        value: "295"
      - key: MEMORY_IN_JOB_ABORT_MB
        value: "335"
      - key: MEMORY_ANALYSIS_CACHE_KEEP
        value: "1"
      # Verified-only strategy routes: empty manifest leaves LIVE unchanged.
      - key: COMMIT34_FAMILIES_ENABLED
        value: "1"
      - key: COMMIT34_PREVIEW_RUNTIME_CACHE_KEEP
        value: "3"
      - key: FUTURES_DATA_CACHE_MAX_ENTRIES
        value: "3"
      - key: FUTURES_MICROSTRUCTURE_CACHE_MAX_ENTRIES
        value: "4"
      - key: LIQUIDATION_HEATMAP_MAX_RESIDENT
        value: "4"
      - key: COMMIT33_3_VISUAL_HARD_RSS_MB
        value: "300"

      # Valid current context logic retained.  No Commit32 runtime overlays.
      - key: COMMIT30_PROPOSAL3_ENABLED
        value: "1"
      - key: COMMIT30_1_FAST_LANE_BRIDGE_ENABLED
        value: "1"
      - key: Q_CLUSTER_ENABLED
        value: "false"
      - key: REGIME_CLASSIFIER_ENABLED
        value: "true"

      # Provider / budget controls retained.
      - key: MAIN_SUPABASE_DAILY_BUDGET_MB
        value: "12"
      - key: OPTIONS_MM_CONTEXT_ENABLED
        value: "1"
      - key: OPTIONS_MM_CACHE_TTL_SECONDS
        value: "7200"
      - key: OPTIONS_MM_DAILY_PROVIDER_BUDGET_MB
        value: "12"
      - key: OPTIONS_MM_MAX_RESPONSE_BYTES
        value: "1572864"
      - key: OPTIONS_MM_MAX_CHAIN_ROWS
        value: "220"
      - key: AI_GROQ_DAILY_TOKEN_BUDGET
        value: "140000"
      - key: AI_GROQ_DAILY_TOKEN_RESERVE
        value: "8000"
      - key: AI_MANUAL_HOURLY_LIMIT
        value: "3"
      - key: AI_MANUAL_MIN_INTERVAL_MINUTES
        value: "20"
      - key: AI_MANUAL_DAILY_LIMIT
        value: "12"

      # Multi-Asset stays enabled, but never gains LIVE authority without route evidence.
      - key: MULTIASSET_ENABLED
        value: "1"
      - key: MULTIASSET_ROUTER_TTL_SECONDS
        value: "900"
      - key: MULTIASSET_ROUTER_CANDLES
        value: "72"
      - key: MULTIASSET_DEEP_LIMIT
        value: "1"
      - key: MULTIASSET_AUTO_DEEP_DAILY_MAX
        value: "6"
      - key: MULTIASSET_AI_AUTOMATIC_ENABLED
        value: "0"

      # 30m is the minimum operational Futures timeframe.  Refresh cadence does
      # not create extra trades; it only keeps snapshots current without hammering RAM.
      - key: FUTURES_INCREMENTAL_INTERVAL_SECONDS
        value: "60"
      - key: SYSTEM_INTERACTIVE_PRIORITY_SECONDS
        value: "120"
      - key: FUTURES_SNAPSHOT_MIN_INTERVAL_SECONDS
        value: "600"
      - key: SAVED_FUTURES_LIFECYCLE_INTERVAL_SECONDS
        value: "60"
      - key: SAVED_FUTURES_LIFECYCLE_RECENT_CANDLES
        value: "96"
      - key: FUTURES_LIFECYCLE_CACHE_MAX_ENTRIES
        value: "8"
      - key: RESOURCE_WATCHDOG_INTERVAL_SECONDS
        value: "10"
      - key: RESOURCE_WATCHDOG_BACKOFF_MB
        value: "325"
      - key: RESOURCE_WATCHDOG_EMERGENCY_MB
        value: "380"
      - key: DERIVATIVES_PROVIDER_HARD_BLOCK_TTL_SECONDS
        value: "21600"
      - key: FUTURES_INCREMENTAL_START_DELAY_SECONDS
        value: "180"
      - key: RUNTIME_BOOTSTRAP_DELAY_SECONDS
        value: "30"

      - key: LEARNING_MICROBATCH_ROWS
        value: "8"
      - key: LEARNING_MICROBATCH_BUDGET_SECONDS
        value: "6"
      - key: LEARNING_MICROBATCHES_PER_CYCLE
        value: "1"
      - key: ANALYTICS_SNAPSHOT_FRESH_SECONDS
        value: "1800"

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SCHEDULED_AUTH_KEY
        sync: false

databases:
  - name: trading-cache
    plan: free
    region: ohio
