services:
  - type: web
    name: crypto-trader-analyst
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn commit21_main_entrypoint:app --timeout 180 --workers 1 --threads 2 --worker-class gthread --graceful-timeout 30 --max-requests 120 --max-requests-jitter 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_ARENA_MAX
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: BLIS_NUM_THREADS
        value: "1"
      - key: FREE_RUNTIME_MAX_THREADS
        value: "10"
      - key: FREE_RUNTIME_BACKGROUND_LOCK_WAIT_SECONDS
        value: "1"
      - key: FREE_RUNTIME_INTERACTIVE_LOCK_WAIT_SECONDS
        value: "10"
      - key: MEMORY_SOFT_LIMIT_MB
        value: "220"
      - key: MEMORY_HARD_LIMIT_MB
        value: "300"
      - key: MEMORY_ANALYSIS_CACHE_KEEP
        value: "1"
      - key: FUTURES_DATA_CACHE_MAX_ENTRIES
        value: "8"
      - key: FUTURES_MICROSTRUCTURE_CACHE_MAX_ENTRIES
        value: "20"
      - key: MEMORY_JOB_START_LIMIT_MB
        value: "200"
      - key: LOW_MEMORY_MODE
        value: "1"
      - key: FREE_PLAN_LOCKDOWN
        value: "1"
      # Commit 20 — Premium Path Expansion. Bounded to two alternate routes;
      # no extra workers, polling or market-data requests.
      - key: PPE_ENABLED
        value: "1"
      - key: PPE_MAX_ALTERNATIVE_ROUTES
        value: "2"
      - key: MAIN_SUPABASE_DAILY_BUDGET_MB
        value: "12"
      # Commit 19.2 — Greeks/options provider guard (budget unchanged). The chart is
      # theoretical/local for unsupported assets; only direct BTC/ETH chains
      # may consume provider egress, under this independent daily cap.
      - key: OPTIONS_MM_CONTEXT_ENABLED
        value: "1"
      - key: OPTIONS_MM_CACHE_TTL_SECONDS
        value: "7200"
      - key: OPTIONS_MM_DAILY_PROVIDER_BUDGET_MB
        value: "12"
      - key: OPTIONS_MM_MAX_RESPONSE_BYTES
        value: "1572864"
      - key: OPTIONS_MM_MAX_CHAIN_ROWS
        value: "220"
      - key: AI_GROQ_DAILY_TOKEN_BUDGET
        value: "160000"
      - key: AI_GROQ_DAILY_TOKEN_RESERVE
        value: "8000"
      - key: AI_MANUAL_HOURLY_LIMIT
        value: "3"
      - key: AI_MANUAL_MIN_INTERVAL_MINUTES
        value: "20"
      - key: AI_MANUAL_DAILY_LIMIT
        value: "12"
      - key: MULTIASSET_ENABLED
        value: "1"
      - key: MULTIASSET_ROUTER_TTL_SECONDS
        value: "900"
      - key: MULTIASSET_ROUTER_CANDLES
        value: "72"
      - key: MULTIASSET_DEEP_LIMIT
        value: "2"
      - key: MULTIASSET_AUTO_DEEP_DAILY_MAX
        value: "12"
      - key: MULTIASSET_AI_AUTOMATIC_ENABLED
        value: "0"
      - key: FUTURES_INCREMENTAL_INTERVAL_SECONDS
        value: "30"
      - key: SYSTEM_INTERACTIVE_PRIORITY_SECONDS
        value: "60"
      - key: FUTURES_SNAPSHOT_MIN_INTERVAL_SECONDS
        value: "120"
      - key: LEARNING_MICROBATCH_ROWS
        value: "8"
      - key: LEARNING_MICROBATCH_BUDGET_SECONDS
        value: "6"
      - key: LEARNING_MICROBATCHES_PER_CYCLE
        value: "1"
      - key: FUTURES_INCREMENTAL_START_DELAY_SECONDS
        value: "180"
      - key: RUNTIME_BOOTSTRAP_DELAY_SECONDS
        value: "30"
      - key: ANALYTICS_SNAPSHOT_FRESH_SECONDS
        value: "1800"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SCHEDULED_AUTH_KEY
        sync: false

databases:
  - name: trading-cache
    plan: free
    region: ohio
