services:
  - type: web
    name: crypto-trader-analyst
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 180 --workers 1 --threads 2 --worker-class gthread --graceful-timeout 30 --max-requests 200 --max-requests-jitter 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Credenciales Supabase — configurar en el dashboard de Render
      # (Settings → Environment → Add Environment Variable)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SCHEDULED_AUTH_KEY
        sync: false

databases:
  - name: trading-cache
    plan: free
    region: ohio
