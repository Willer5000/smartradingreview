services:
  - type: web
    name: crypto-trader-analyst
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 180 --workers 1 --threads 1 --worker-class gthread --graceful-timeout 30 --max-requests 120 --max-requests-jitter 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MEMORY_SOFT_LIMIT_MB
        value: "250"
      - key: MEMORY_HARD_LIMIT_MB
        value: "340"
      - key: MEMORY_ANALYSIS_CACHE_KEEP
        value: "2"
      - key: FUTURES_DATA_CACHE_MAX_ENTRIES
        value: "2"
      - key: MEMORY_JOB_START_LIMIT_MB
        value: "240"
      - key: LOW_MEMORY_MODE
        value: "1"
      - key: FUTURES_INCREMENTAL_INTERVAL_SECONDS
        value: "15"
      - key: FUTURES_INCREMENTAL_START_DELAY_SECONDS
        value: "180"
      - key: ANALYTICS_SNAPSHOT_FRESH_SECONDS
        value: "1800"
      # Credenciales Supabase — configurar en el dashboard de Render
      # (Settings → Environment → Add Environment Variable)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SCHEDULED_AUTH_KEY
        sync: false

databases:
  - name: trading-cache
    plan: free
    region: ohio
