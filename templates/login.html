<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>Acceso privado</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #050812;
            color: #edf3ff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            width: min(100%, 390px);
            padding: 30px;
            border: 1px solid rgba(148, 163, 184, .18);
            border-radius: 18px;
            background: rgba(15, 23, 42, .88);
            box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
        }
        h1 { margin: 0 0 8px; font-size: 1.45rem; }
        p { margin: 0 0 24px; color: #9fb0ca; line-height: 1.5; }
        label { display: block; margin: 14px 0 7px; font-size: .9rem; color: #cbd5e1; }
        input {
            width: 100%;
            border: 1px solid #334155;
            border-radius: 11px;
            padding: 12px 13px;
            background: #0b1220;
            color: #f8fafc;
            outline: none;
            font: inherit;
        }
        input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, .12); }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px 14px;
            border: 0;
            border-radius: 11px;
            background: #2563eb;
            color: white;
            font: 600 1rem/1 inherit;
            cursor: pointer;
        }
        button:disabled { opacity: .58; cursor: wait; }
        #error {
            min-height: 22px;
            margin-top: 14px;
            color: #fca5a5;
            font-size: .9rem;
        }
        .private { margin-top: 8px; color: #64748b; font-size: .78rem; text-align: center; }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="title">
        <h1 id="title">Acceso privado</h1>
        <p>Inicia sesión para continuar.</p>
        <form id="loginForm" autocomplete="on">
            <label for="user">Usuario</label>
            <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button id="submitBtn" type="submit">Ingresar</button>
            <div id="error" role="alert" aria-live="polite"></div>
        </form>
        <div class="private">Sistema de acceso restringido.</div>
    </main>

    <script>
        const nextUrl = {{ next_url|tojson }};
        const form = document.getElementById('loginForm');
        const button = document.getElementById('submitBtn');
        const errorBox = document.getElementById('error');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.textContent = '';
            button.disabled = true;
            button.textContent = 'Verificando…';
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user: document.getElementById('user').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.authenticated) {
                    errorBox.textContent = data.error || 'No se pudo iniciar sesión.';
                    return;
                }
                window.location.replace(nextUrl || '/');
            } catch (error) {
                errorBox.textContent = 'No se pudo conectar. Intenta nuevamente.';
            } finally {
                button.disabled = false;
                button.textContent = 'Ingresar';
            }
        });
    </script>
</body>
</html>
